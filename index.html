<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>CVHB LLC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1410;
      --bg-2: #1a221c;
      --ink: #e8efe6;
      --muted: #9aab9c;
      --line: #2a352c;
      --accent: #c4e86b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, #243028 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, #1c2818 0%, transparent 50%),
        var(--bg);
      line-height: 1.5;
    }

    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 3rem;
    }

    .brand {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(2.75rem, 8vw, 3.75rem);
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 0.75rem;
    }

    .lede {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 28rem;
      margin-bottom: 2.5rem;
    }

    h2 {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.85rem;
    }

    ul {
      list-style: none;
      border-top: 1px solid var(--line);
    }

    li {
      border-bottom: 1px solid var(--line);
    }

    a {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding: 1rem 0;
      color: var(--ink);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    a:hover { color: var(--accent); }

    a span { color: var(--muted); font-size: 0.9rem; }
    a:hover span { color: var(--accent); }

    footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    footer a {
      display: inline;
      padding: 0;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1 class="brand">CVHB LLC</h1>
    <p class="lede">Software and apps from North Carolina.</p>

    <h2>What we work on</h2>
    <ul>
      <li>
        <a href="https://apps.apple.com/us/developer/lets-hang-llc/id1123158231" rel="noopener noreferrer">
          Apps on the App Store
          <span>View →</span>
        </a>
      </li>
      <li>
        <a href="https://apps.apple.com/us/app/truth-finder-ai/id6758062068" rel="noopener noreferrer">
          Truth Finder AI
          <span>View →</span>
        </a>
      </li>
    </ul>

    <footer>
      <a href="app-ads.txt">app-ads.txt</a>
    </footer>
  </main>
</body>
</html>
